#------------------------------------------------COMPONENTES-------------------------------------------------------------------


components:
  schemas:
    Filme:
      required:
        - nome
        - sinopse
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
        duracao:
          type: string
        valor:
          type: integer
        avaliacao:
          type: integer
        capa:
          type: string


    Atividade:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string

    Genero:
      required:
        - nome_genero
      type: object
      properties:
        id:
          type: integer
        nome_genero:
          type: string

          
    Classificacao:
      required:
        - nome
        - sigla
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        sigla:
          type: string
        caracteristica:
          type: string

  requestBodies:
    Filme:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'

    Atividade:
        description: Objeto que deve ser enviado no Body das requisicoes
        content:
          application/json:
           schema:
            $ref: '#/components/schemas/Atividade'

    Genero:
        description: Objeto que deve ser enviado no Body das requisicoes
        content:
          application/json:
           schema:
            $ref: '#/components/schemas/Genero'

    Classificacao:
        description: Objeto que deve ser enviado no Body das requisicoes
        content:
          application/json:
           schema:
            $ref: '#/components/schemas/Classificacao'